databases:
- name: portfolio
plan: free
services:
- type: web
name: dev-portfolio
runtime: ruby
plan: free
region: oregon
buildCommand: "./bin/render-build.sh" # This runs the script file we
created
startCommand: "bundle exec rails server"
envVars:
- key: DATABASE_URL
fromDatabase:
name: portfolio
property: connectionString
- key: RAILS_ENV
value: production
- key: RAILS_MASTER_KEY
sync: false
- key: WEB_CONCURRENCY
value: 2 # sensible default
